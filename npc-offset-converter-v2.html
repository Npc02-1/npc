<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NPC Offset Converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d12;--surface:#171c26;--raised:#202734;--inset:#090b10;
  --fg:#f4f0e8;--muted:#a3adbd;--faint:#8b95a6;
  --line:#2e3644;--line-strong:#465066;
  --accent:#ff5a1f;--on-accent:#1a0904;
  --sans:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;color-scheme:dark}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:2px;background:var(--accent);z-index:40}
button,label{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent);color:var(--on-accent)}
main{max-width:720px;margin:0 auto;padding:32px 20px 96px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mark{width:14px;height:14px;background:var(--accent);transform:rotate(45deg)}
.swatches{display:flex}
.swatches button{width:44px;height:44px;border:0;background:transparent;border-radius:999px;display:grid;place-items:center}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.swatches i{width:14px;height:14px;border-radius:999px;display:block}
h1{margin:22px 0 0;font-size:clamp(40px,10vw,56px);line-height:.95;font-weight:600;letter-spacing:-.03em}
h1 em{font-style:normal;color:var(--accent)}
.lede{margin:14px 0 0;max-width:28rem;color:var(--muted);font-size:14px}
header{border-bottom:1px solid var(--line);padding-bottom:28px}
section{margin-top:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h h2{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;display:flex;gap:12px;align-items:baseline}
.step{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--accent)}
.aside{font-family:var(--mono);font-size:12px;color:var(--faint)}
input,textarea{
  width:100%;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);
  border-radius:12px;padding:12px 14px;font-family:var(--mono);font-size:15px;
}
input{height:48px}
textarea{min-height:160px;resize:vertical;line-height:1.6}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,textarea:focus{border-color:var(--accent);outline:none}
.proto{
  width:100%;height:56px;display:flex;align-items:center;gap:12px;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);
  border-radius:12px;padding:0 16px;text-align:left;
}
.proto .tag{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.proto .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14px}
.proto svg{flex:none;transition:transform .2s}
.proto[aria-expanded="true"] svg{transform:rotate(180deg)}
.sheet{margin-top:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{height:40px;border-radius:999px;padding:0 12px;font-size:14px;font-weight:500;border:1px solid var(--line);background:transparent;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.modes{margin-top:12px;max-height:320px;overflow:auto}
.modes button{width:100%;min-height:48px;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--muted);border-radius:8px;padding:0 12px;text-align:left;font-size:14px}
.modes button[aria-pressed="true"]{background:var(--bg);color:var(--fg);font-weight:600}
.dot{width:8px;height:8px;transform:rotate(45deg);background:var(--line-strong);flex:none}
.modes button[aria-pressed="true"] .dot{background:var(--accent)}
.hook{margin-top:12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lbl{display:block;margin-bottom:6px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.seg{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--inset);padding:4px;border-radius:8px}
.seg button{height:40px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.preview{margin-top:12px;border-left:2px solid var(--accent);background:var(--inset);padding:8px 12px;font-family:var(--mono);font-size:12px;line-height:1.6;color:var(--muted);word-break:break-all}
.row{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.file{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted);position:relative;height:44px;display:inline-flex;align-items:center}
.file input{position:absolute;inset:0;opacity:0;height:100%;cursor:pointer}
.hint{font-family:var(--mono);font-size:12px;color:var(--faint)}
.go{margin-top:12px;width:100%;height:56px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:600}
.go.done{background:var(--fg);color:var(--bg)}
.go:disabled{opacity:.8}
.actions{margin-top:12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.actions button{height:48px;border-radius:12px;font-size:14px;font-weight:600}
.copy{background:var(--fg);color:var(--bg);border:0}
.dump{background:transparent;color:var(--fg);border:1px solid var(--line-strong)}
.wipe{background:transparent;color:var(--muted);border:1px solid var(--line)}
.scan-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scan-btns button{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;font-size:14px}
.scan-btns button.ghost{background:transparent;color:var(--muted)}
.stats{margin-top:12px;display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid var(--line-strong);border-radius:12px;overflow:hidden;background:var(--surface)}
.stat{padding:12px}
.stat + .stat{border-left:1px solid var(--line)}
.stat span{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.stat b{display:block;margin-top:4px;font-size:24px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
pre{margin:12px 0 0;max-height:256px;overflow:auto;border:1px solid var(--line);background:var(--inset);border-radius:12px;padding:16px;font-family:var(--mono);font-size:12px;line-height:1.6;color:var(--muted);white-space:pre;word-break:break-all}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.preset{min-height:64px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:8px 12px;text-align:left}
.preset b{display:block;font-size:14px}
.preset span{display:block;margin-top:4px;font-family:var(--mono);font-size:12px;color:var(--faint);word-break:break-all}
.drop.over{box-shadow:0 0 0 2px var(--accent);border-radius:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:var(--fg);color:var(--bg);font-family:var(--mono);font-size:12px;padding:8px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:900px){
  main{max-width:1100px}
  .cols{display:grid;grid-template-columns:1fr 1fr;column-gap:64px;align-items:start}
  .cols section{margin-top:28px}
}
@media (max-width:699px){.aside.desk{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <div class="top">
      <div class="brand"><span class="mark"></span>NPC</div>
      <div class="swatches" id="swatches"></div>
    </div>
    <h1>Offset<br><em>converter</em></h1>
    <p class="lede">Turn MemoryPatch, HexPatches, sub_xxxxx, and raw offsets into paste-ready ARM64.</p>
  </header>

  <div class="cols">
    <div>
      <section>
        <div class="sec-h"><h2><span class="step">01</span>Library</h2></div>
        <input id="lib" value="libanogs.so" spellcheck="false" autocapitalize="off" placeholder="libanogs.so">
      </section>

      <section>
        <div class="sec-h"><h2><span class="step">02</span>Protocol</h2></div>
        <button class="proto" id="protoBtn" type="button" aria-expanded="false">
          <span class="tag" id="protoTag">Translate</span>
          <span class="name" id="protoName">MemoryPatch → HexPatches</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="sheet" id="sheet" hidden>
          <div class="chips" id="chips"></div>
          <div class="modes" id="modes"></div>
        </div>
        <div class="hook" id="hook" hidden>
          <div class="pair">
            <label><span class="lbl">Hook</span><input id="hookFn" value="hook_bypass" spellcheck="false" autocapitalize="off"></label>
            <label><span class="lbl">Original</span><input id="origFn" value="orig_bypass" spellcheck="false" autocapitalize="off"></label>
          </div>
          <p class="lede" id="kittyNote" hidden style="margin-top:12px">KittyMemory::getAbsoluteAddress, wrapped in OBFUSCATE.</p>
          <div class="seg" id="seg">
            <button type="button" data-style="A" aria-pressed="true">Direct</button>
            <button type="button" data-style="B" aria-pressed="false">OBFUSCATE</button>
          </div>
          <p class="preview" id="preview"></p>
        </div>
      </section>

      <section>
        <div class="sec-h"><h2><span class="step">06</span>ARM hex</h2></div>
        <div class="grid" id="presets"></div>
      </section>
    </div>

    <div>
      <section>
        <div class="sec-h"><h2><span class="step">03</span>Payload</h2><span class="aside desk">Ctrl + Enter</span></div>
        <div class="drop" id="drop">
          <textarea id="input" spellcheck="false" autocapitalize="off" placeholder="Paste offsets, MemoryPatch, HexPatches, or sub_xxxxx"></textarea>
        </div>
        <div class="row">
          <label class="file">Load .txt<input id="file" type="file" accept=".txt,text/plain"></label>
          <span class="hint">Drop a file on the field</span>
        </div>
        <button class="go" id="go" type="button">Execute</button>
      </section>

      <section>
        <div class="sec-h"><h2><span class="step">04</span>Output</h2><span class="aside" id="lineCount"></span></div>
        <textarea id="output" readonly placeholder="Output lands here."></textarea>
        <div class="actions">
          <button class="copy" id="copy" type="button">Copy</button>
          <button class="dump" id="dump" type="button">Dump</button>
          <button class="wipe" id="wipe" type="button">Wipe</button>
        </div>
      </section>

      <section>
        <div class="sec-h"><h2><span class="step">05</span>Scanner</h2></div>
        <div class="scan-btns">
          <button type="button" id="count">Count lines</button>
          <button class="ghost" type="button" id="view">View index</button>
        </div>
        <div class="stats">
          <div class="stat"><span>Lines</span><b id="nLines">—</b></div>
          <div class="stat"><span>Offsets</span><b id="nOff">—</b></div>
          <div class="stat"><span>Unique</span><b id="nUniq">—</b></div>
        </div>
        <pre id="scan" hidden></pre>
      </section>
    </div>
  </div>
</main>
<div id="toast" role="status"></div>
<script>
const DEFAULT_HEX_MEM = "00 00 80 D2 C0 03 5F D6";
const DEFAULT_HEX_HEX = "h00 00 80 D2 C0 03 5F D6";
const PRESETS = [
  ["armTrue","20 00 80 D2 C0 03 5F D6"],["armFalse","00 00 80 D2 C0 03 5F D6"],
  ["armReturn","C0 03 5F D6 C0 03 5F D6"],["armNop","1F 20 03 D5"],
  ["armAim1","40 00 00 1C"],["armAim2","C0 03 5F D6"],
  ["frames","C0 00 80 D2 C0 03 5F D6"],["frames1","00 24 80 D2 C0 03 5F D6"],
  ["flh","00 2C 40 BC C0 03 5F D6"],["ammos","00 00 80 52 C0 03 5F D6"],
  ["halfspeed","00 90 20 1E C0 03 5F D6"],["armLDR","40 00 00 1C C0 03 5F D6"]
];
const GROUPS = [
  {id:"translate",label:"Translate",modes:[
    [0,"MemoryPatch → HexPatches"],[1,"HexPatches → MemoryPatch"],
    [2,"patchOffset → MemoryPatch"],[3,"patchOffset → HexPatches"]]},
  {id:"address",label:"Address",modes:[
    [4,"Offsets → MemoryPatch"],[5,"Offsets → HexPatches"],[8,"Offset → only"],
    [6,"sub_xxxxx → MemoryPatch"],[7,"sub_xxxxx → HexPatches"],
    [9,"sub_xxxxx → offset only"],[10,"Align → full code"]]},
  {id:"hook",label:"Hook",modes:[
    [11,"KittyMemory → hook"],[16,"Offset → hook"],
    [17,"sub_xxxxx → hook"],[18,"MemoryPatch → hook"]]},
  {id:"var",label:"Variable",modes:[
    [13,"Var → offset only"],[14,"Var → MemoryPatch"],[15,"Var → HexPatches"]]},
  {id:"clean",label:"Clean",modes:[[12,"Remove duplicate offsets"]]}
];
const ACCENTS = [
  ["ember","#FF5A1F","#1A0904"],["crimson","#E23B4A","#FFF8F8"],
  ["teal","#12B5A0","#04221E"],["violet","#7C6BF2","#F8F7FF"]
];
const HOOKS = [11,16,17,18];
let mode = 0, groupId = "translate", hookStyle = "A", toastTimer = 0, doneTimer = 0;

const $ = (id) => document.getElementById(id);
function fixXCase(str){return str.replace(/0[Xx][0-9a-fA-F]+/g,m=>"0x"+m.slice(2).toUpperCase())}
function spacedHex(raw){
  const clean = raw.replace(/\s+/g,"").replace(/^[hH]/,"").toUpperCase();
  let out=""; for(let i=0;i<clean.length;i+=2){ if(i) out+=" "; out+=clean.slice(i,i+2); } return out;
}
function ctx(){
  return {
    lib: $("lib").value.trim() || "libanogs.so",
    hookFn: $("hookFn").value.trim() || "hook_bypass",
    origFn: $("origFn").value.trim() || "orig_bypass",
    hookStyle
  };
}
function buildHookLine(c, offset){
  const addr = c.hookStyle === "A"
    ? `getAbsoluteAddress("${c.lib}", ${offset})`
    : `getAbsoluteAddress(OBFUSCATE("${c.lib}"), ${offset})`;
  return `Tools::Hook((void*)${addr}, (void*)${c.hookFn}, (void**)&${c.origFn});`;
}
function hookPreview(m, c){
  if (m === 11) return `Tools::Hook((void*)KittyMemory::getAbsoluteAddress(OBFUSCATE("${c.lib}"), 0x204218), (void*)${c.hookFn}, (void**)&${c.origFn});`;
  return buildHookLine(c, "0x204218");
}
function convertMemToHex(src){const m=src.match(/MemoryPatch::createWithHex\("([^"]+)",\s*(0[xX][0-9a-fA-F]+),\s*"([0-9a-fA-F\s]+)"\)\.Modify\(\);?/); if(!m) return src; return `HexPatches.MemoryPatch("${m[1]}", ${fixXCase(m[2])}, "h${spacedHex(m[3])}", 32);`;}
function convertHexToMem(src){const m=src.match(/HexPatches\.MemoryPatch\("([^"]+)",\s*(0[xX][0-9a-fA-F]+),\s*"h?([0-9a-fA-F\s]+)",\s*\d+\);?/); if(!m) return src; return `MemoryPatch::createWithHex("${m[1]}", ${fixXCase(m[2])}, "${spacedHex(m[3])}").Modify();`;}
function patchOffsetToMem(src){const m=src.match(/patchOffset\("([^"]+)",\s*(0[xX][0-9a-fA-F]+),\s*"h?([0-9a-fA-F\s]+)",\s*32\);?/); if(!m) return src; return `MemoryPatch::createWithHex("${m[1]}", ${fixXCase(m[2])}, "${spacedHex(m[3])}").Modify();`;}
function patchOffsetToHex(src){const m=src.match(/patchOffset\("([^"]+)",\s*(0[xX][0-9a-fA-F]+),\s*"h?([0-9a-fA-F\s]+)",\s*32\);?/); if(!m) return src; return `HexPatches.MemoryPatch("${m[1]}", ${fixXCase(m[2])}, "h${spacedHex(m[3])}", 32);`;}
function offsetToMem(src,c){const m=src.match(/0[xX][0-9a-fA-F]+/); if(!m) return src; return `MemoryPatch::createWithHex("${c.lib}", ${fixXCase(m[0])}, "${DEFAULT_HEX_MEM}").Modify();`;}
function offsetToHex(src,c){const m=src.match(/0[xX][0-9a-fA-F]+/); if(!m) return src; return `HexPatches.MemoryPatch("${c.lib}", ${fixXCase(m[0])}, "${DEFAULT_HEX_HEX}", 32);`;}
function subToMem(src,c){const m=src.match(/sub_([0-9a-fA-F]+)/); if(!m) return src; return `MemoryPatch::createWithHex("${c.lib}", 0x${m[1].toUpperCase()}, "${DEFAULT_HEX_MEM}").Modify();`;}
function subToHex(src,c){const m=src.match(/sub_([0-9a-fA-F]+)/); if(!m) return src; return `HexPatches.MemoryPatch("${c.lib}", 0x${m[1].toUpperCase()}, "${DEFAULT_HEX_HEX}", 32);`;}
function subToOffset(src){const s=src.match(/sub_([0-9a-fA-F]+)/); if(s) return "0x"+s[1].toUpperCase(); const o=src.match(/0[xX][0-9a-fA-F]+/); if(o) return fixXCase(o[0]); return src;}
function kittyToHook(src,c){const m=src.match(/0[xX][0-9a-fA-F]+/); if(!m) return src; return `Tools::Hook((void*)KittyMemory::getAbsoluteAddress(OBFUSCATE("${c.lib}"), ${fixXCase(m[0])}), (void*)${c.hookFn}, (void**)&${c.origFn});`;}
function offsetToHookAbs(src,c){const m=src.match(/0[xX][0-9a-fA-F]+/); if(!m) return src; return buildHookLine(c, fixXCase(m[0]));}
function subToHookAbs(src,c){const s=src.match(/sub_([0-9a-fA-F]+)/); if(s) return buildHookLine(c,"0x"+s[1].toUpperCase()); const o=src.match(/0[xX][0-9a-fA-F]+/); if(o) return buildHookLine(c, fixXCase(o[0])); return src;}
function memPatchToHookAbs(src,c){let m=src.match(/MemoryPatch::createWithHex\("([^"]+)",\s*(0[xX][0-9a-fA-F]+)/); if(m) return buildHookLine({...c,lib:m[1]}, fixXCase(m[2])); m=src.match(/HexPatches\.MemoryPatch\("([^"]+)",\s*(0[xX][0-9a-fA-F]+)/); if(m) return buildHookLine({...c,lib:m[1]}, fixXCase(m[2])); const o=src.match(/0[xX][0-9a-fA-F]+/); if(o) return buildHookLine(c, fixXCase(o[0])); return src;}
function extractOffsetFromVar(line){const m=line.match(/([0-9a-fA-F]+)\s*$/); if(m && /^[0-9a-fA-F]+$/.test(m[1])) return "0x"+m[1].toUpperCase(); return null;}
function extractLibFromVar(line){const m=line.match(/\|([^|]+\.so)/); if(m){const n=m[1].match(/\/([^/]+\.so)$/); if(n) return n[1];} return "libanogs.so";}
function varToOffset(src){return src.split(/\r?\n/).map(l=>extractOffsetFromVar(l)||l).join("\n");}
function varToMemoryPatch(src){return src.split(/\r?\n/).map(line=>{const o=extractOffsetFromVar(line), lib=extractLibFromVar(line); return o?`MemoryPatch::createWithHex("${lib}", ${o}, "${DEFAULT_HEX_MEM}").Modify();`:line;}).join("\n");}
function varToHexPatches(src){return src.split(/\r?\n/).map(line=>{const o=extractOffsetFromVar(line), lib=extractLibFromVar(line); return o?`HexPatches.MemoryPatch("${lib}", ${o}, "${DEFAULT_HEX_HEX}", 32);`:line;}).join("\n");}
function extractAllOffsets(src){
  const seen={}, offsets=[];
  for (const o of src.matchAll(/0[xX][0-9a-fA-F]+/g)){const f=fixXCase(o[0]); if(!seen[f]){seen[f]=1; offsets.push(f);}}
  for (const s of src.matchAll(/sub_([0-9a-fA-F]+)/g)){const o="0x"+s[1].toUpperCase(); if(!seen[o]){seen[o]=1; offsets.push(o);}}
  offsets.sort((a,b)=>parseInt(a.slice(2),16)-parseInt(b.slice(2),16));
  return offsets.length?offsets.join("\n"):"NO OFFSETS FOUND";
}
function removeDuplicateOffsets(src){
  const seen={}, rows=[];
  for (const line of src.split(/\r?\n/)){
    const found=(line.match(/0[xX][0-9a-fA-F]+/)||line.match(/sub_[0-9a-fA-F]+/))?.[0];
    if(found){const key=fixXCase(found); if(!seen[key]){seen[key]=1; rows.push(line);}}
    else rows.push(line);
  }
  return rows.join("\n");
}
const LINE = {0:convertMemToHex,1:convertHexToMem,2:patchOffsetToMem,3:patchOffsetToHex,4:offsetToMem,5:offsetToHex,6:subToMem,7:subToHex,9:subToOffset,11:kittyToHook,16:offsetToHookAbs,17:subToHookAbs,18:memPatchToHookAbs,13:varToOffset,14:varToMemoryPatch,15:varToHexPatches};
function runConvert(raw, m, c){
  if(!raw.trim()) return {text:"// NO PAYLOAD DETECTED", count:0, ok:false};
  if(m===8||m===10){const text=extractAllOffsets(raw); return {text, count:0, ok:text!=="NO OFFSETS FOUND"};}
  if(m===12){const text=removeDuplicateOffsets(raw); return {text, count:0, ok:!!text && !text.startsWith("//")};}
  const fn=LINE[m]; if(!fn) return {text:"// UNKNOWN PROTOCOL", count:0, ok:false};
  const converted=[];
  for(const line of raw.split(/\r?\n/)){const t=line.trim(); if(!t) continue; const next=fn(t,c); if(next&&next.trim()) converted.push(next);}
  if(!converted.length) return {text:"// NO VALID PAYLOAD FOUND", count:0, ok:false};
  return {text:converted.join("\n"), count:converted.length, ok:true};
}
function countOffsets(src){
  let total=0, withO=0; const unique={};
  for(const line of src.split(/\r?\n/)){total++; let has=false;
    for(const o of line.matchAll(/0[xX][0-9a-fA-F]+/g)){has=true; unique[fixXCase(o[0])]=1;}
    for(const s of line.matchAll(/sub_([0-9a-fA-F]+)/g)){has=true; unique["0x"+s[1].toUpperCase()]=1;}
    if(has) withO++;
  }
  const u=Object.keys(unique).length;
  return {lines:total, offsets:withO, unique:u, body:`TOTAL LINES    : ${total}\nWITH OFFSETS   : ${withO}\nUNIQUE OFFSETS : ${u}`};
}
function viewOffsets(src){
  const lines=src.split(/\r?\n/), rows=[]; let offsetCount=0; const unique={};
  lines.forEach((line,i)=>{let has=false;
    for(const o of line.matchAll(/0[xX][0-9a-fA-F]+/g)){has=true; offsetCount++; const k=fixXCase(o[0]); unique[k]=(unique[k]||0)+1;}
    rows.push(`${String(i+1).padStart(4)} │ ${has?"◆ ":"  "}${fixXCase(line)}`);
  });
  const u=Object.keys(unique).length;
  return {lines:lines.length, offsets:offsetCount, unique:u, body:`OFFSET VIEW  ·  LINES ${lines.length}  ·  UNIQUE ${u}\n${"─".repeat(36)}\n${rows.join("\n")}`};
}

function current(){
  for(const g of GROUPS){const hit=g.modes.find(x=>x[0]===mode); if(hit) return {group:g, mode:hit};}
  return {group:GROUPS[0], mode:GROUPS[0].modes[0]};
}
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}
function paintProtocol(){
  const cur=current();
  $("protoTag").textContent=cur.group.label;
  $("protoName").textContent=cur.mode[1];
  $("chips").innerHTML=GROUPS.map(g=>`<button type="button" data-g="${g.id}" aria-pressed="${g.id===groupId}">${g.label}</button>`).join("");
  const g=GROUPS.find(x=>x.id===groupId);
  $("modes").innerHTML=g.modes.map(([id,title])=>`<button type="button" data-m="${id}" aria-pressed="${id===mode}"><span class="dot"></span>${title}</button>`).join("");
  const hook=HOOKS.includes(mode);
  $("hook").hidden=!hook;
  if(hook){
    $("kittyNote").hidden=mode!==11;
    $("seg").hidden=mode===11;
    $("preview").textContent=hookPreview(mode, ctx());
  }
}
function setAccent(hex, ink, btn){
  document.documentElement.style.setProperty("--accent", hex);
  document.documentElement.style.setProperty("--on-accent", ink);
  document.querySelectorAll("#swatches button").forEach(b=>b.setAttribute("aria-pressed", b===btn?"true":"false"));
}
$("swatches").innerHTML=ACCENTS.map(([id,hex],i)=>`<button type="button" aria-label="${id}" aria-pressed="${i===0}" data-hex="${hex}" data-ink="${ACCENTS[i][2]}"><i style="background:${hex}"></i></button>`).join("");
$("swatches").onclick=(e)=>{const b=e.target.closest("button"); if(!b) return; setAccent(b.dataset.hex, b.dataset.ink, b);};
$("presets").innerHTML=PRESETS.map(([id,hex])=>`<button class="preset" type="button" data-hex="${hex}"><b>${id}</b><span>${hex}</span></button>`).join("");
$("presets").onclick=(e)=>{const b=e.target.closest("button"); if(!b) return; $("output").value=b.dataset.hex; syncLines(); toast("Injected "+b.querySelector("b").textContent);};
$("protoBtn").onclick=()=>{const open=$("sheet").hidden; $("sheet").hidden=!open; $("protoBtn").setAttribute("aria-expanded", open?"true":"false");};
$("sheet").onclick=(e)=>{
  const g=e.target.closest("[data-g]"); if(g){groupId=g.dataset.g; paintProtocol(); return;}
  const m=e.target.closest("[data-m]"); if(m){mode=+m.dataset.m; groupId=current().group.id; $("sheet").hidden=true; $("protoBtn").setAttribute("aria-expanded","false"); paintProtocol();}
};
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{hookStyle=b.dataset.style; document.querySelectorAll("#seg button").forEach(x=>x.setAttribute("aria-pressed", x===b?"true":"false")); paintProtocol();});
["lib","hookFn","origFn"].forEach(id=>$(id).addEventListener("input", paintProtocol));
function syncLines(){
  const v=$("output").value;
  const n=v?v.split(/\r?\n/).length:0;
  $("lineCount").textContent=n?(n===1?"1 line":n+" lines"):"";
}
function execute(){
  const btn=$("go");
  clearTimeout(doneTimer);
  btn.disabled=true; btn.textContent="Processing"; btn.classList.remove("done");
  setTimeout(()=>{
    const result=runConvert($("input").value, mode, ctx());
    $("output").value=result.text; syncLines();
    if(result.count>0) toast(result.count===1?"Patched 1 line":`Patched ${result.count} lines`);
    else if(!$("input").value.trim()) toast("No payload");
    btn.disabled=false;
    if(result.ok){btn.classList.add("done"); btn.textContent="Done"; doneTimer=setTimeout(()=>{btn.classList.remove("done"); btn.textContent="Execute";},1600);}
    else btn.textContent="Execute";
  },40);
}
$("go").onclick=execute;
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){e.preventDefault(); execute();}});
async function copyOut(){
  const text=$("output").value; if(!text.trim()){toast("No output"); return;}
  try{await navigator.clipboard.writeText(text);}catch{
    const a=document.createElement("textarea"); a.value=text; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove();
  }
  toast("Copied");
}
$("copy").onclick=copyOut;
$("dump").onclick=()=>{
  const text=$("output").value; if(!text.trim()){toast("No output"); return;}
  const blob=new Blob([text],{type:"text/plain"}); const link=document.createElement("a");
  link.href=URL.createObjectURL(blob); link.download="npc_output.txt"; link.click(); URL.revokeObjectURL(link.href); toast("Dumped");
};
$("wipe").onclick=()=>{$("input").value=""; $("output").value=""; syncLines(); $("nLines").textContent=$("nOff").textContent=$("nUniq").textContent="—"; $("scan").hidden=true; $("scan").textContent=""; toast("Wiped");};
function readFile(file){const r=new FileReader(); r.onload=()=>{$("input").value=String(r.result||""); toast("Loaded "+file.name);}; r.readAsText(file);}
$("file").onchange=(e)=>{const f=e.target.files&&e.target.files[0]; if(f) readFile(f); e.target.value="";};
const drop=$("drop");
drop.ondragover=(e)=>{e.preventDefault(); drop.classList.add("over");};
drop.ondragleave=()=>drop.classList.remove("over");
drop.ondrop=(e)=>{e.preventDefault(); drop.classList.remove("over"); const f=e.dataTransfer.files[0]; if(f) readFile(f);};
function showScan(kind){
  const src=$("input").value; if(!src.trim()){toast("No payload"); return;}
  const result=kind==="count"?countOffsets(src):viewOffsets(src);
  $("nLines").textContent=result.lines; $("nOff").textContent=result.offsets; $("nUniq").textContent=result.unique;
  $("scan").hidden=false; $("scan").textContent=result.body;
}
$("count").onclick=()=>showScan("count");
$("view").onclick=()=>showScan("view");
paintProtocol();
</script>
